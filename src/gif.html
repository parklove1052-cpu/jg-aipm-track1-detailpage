<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:'Pretendard Variable',Pretendard,sans-serif;word-break:keep-all}
  .sec{width:860px;background:linear-gradient(170deg,#0b0b1a,#131a3c);color:#eef1ff;padding:62px 64px;position:relative;overflow:hidden}
  .kicker{font-size:19px;font-weight:800;letter-spacing:.14em;color:#8fa6ff}
  h2{font-size:42px;line-height:1.3;letter-spacing:-.035em;font-weight:800;margin-top:14px}
  .lead{margin-top:16px;font-size:21px;color:rgba(230,235,255,.7);line-height:1.7}

  /* ── 움직이는 영역: 두꺼운 책이 얇은 자료집으로 ── */
  .stage{margin-top:38px;display:flex;align-items:flex-end;justify-content:center;gap:70px;height:330px}
  .stack{position:relative;width:210px;height:300px;display:flex;flex-direction:column-reverse;align-items:center}
  .sheet{width:200px;height:26px;border-radius:5px;background:linear-gradient(90deg,#e9edf8,#cfd6ea);
         border:1px solid #b9c2dc;margin-top:-1px;position:relative}
  .sheet.gone{opacity:0}
  .cap{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:700}
  .capTop{bottom:-34px;color:rgba(210,218,255,.65)}

  .arrow{font-size:40px;color:#8fa6ff;padding-bottom:120px}

  .book{width:210px;height:290px;border-radius:9px;background:linear-gradient(150deg,#fdfdff,#e6ebf8);
        border:1px solid #d6ddef;box-shadow:0 22px 46px rgba(0,0,0,.42);
        display:flex;flex-direction:column;justify-content:space-between;padding:24px 20px;position:relative}
  .book .d7{font-size:56px;font-weight:800;color:#13246b;letter-spacing:-.05em;line-height:1}
  .book .t{font-size:22px;font-weight:800;color:#1b2550;line-height:1.35;letter-spacing:-.03em}
  .book .s{font-size:14px;color:#7b84a3;margin-top:6px}

  /* 별점 도장 */
  .stamp{position:absolute;right:-16px;top:-16px;width:92px;height:92px;border-radius:50%;
         background:#2b4bd8;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-size:15px;font-weight:800;line-height:1.3;box-shadow:0 10px 26px rgba(43,75,216,.5);
         opacity:0;transform:scale(.4) rotate(-20deg)}
  .stamp.on{opacity:1;transform:scale(1) rotate(-10deg)}
  .stamp .st{font-size:19px;letter-spacing:.06em}

  .cnt{position:absolute;left:50%;transform:translateX(-50%);bottom:-34px;
       font-size:17px;font-weight:800;color:#9fb4ff;white-space:nowrap}

  .line{margin-top:52px;font-size:25px;font-weight:700;text-align:center;letter-spacing:-.02em;min-height:36px}
  .line b{color:#9fb4ff}
</style>
</head>
<body>
<section class="sec" id="gif">
  <span class="kicker">EFFECT 01</span>
  <h2>전 범위 <span style="color:#9fb4ff">전부</span>가 아니라,<br>3개년에 <span style="color:#9fb4ff">실제로 나온 것</span>만.</h2>
  <p class="lead">두꺼운 수험서에서 안 나오는 것을 덜어내면, 7일에 들어갑니다.</p>

  <div class="stage">
    <div class="stack" id="stack">
      <div class="cap capTop">전 범위 수험서</div>
    </div>
    <div class="arrow">→</div>
    <div class="book">
      <div class="d7">7</div>
      <div>
        <div class="t">한능검<br>7일 벼락치기<br>자료집</div>
        <div class="s">최다빈출 개념 + 실제 출제 문항</div>
      </div>
      <div class="stamp" id="stamp"><div class="st">★★★★★</div><div>최다빈출</div></div>
      <div class="cnt" id="cnt">남긴 개념 ○○개</div>
    </div>
  </div>

  <div class="line" id="line"></div>
</section>

<script>
  // 프레임마다 window.__step(i) 를 불러 모양을 바꾼다 (shot_gif.cjs 가 호출)
  var N = 12;                       // 쌓인 종이 장 수
  var stack = document.getElementById('stack');
  for (var i = 0; i < N; i++) {
    var d = document.createElement('div');
    d.className = 'sheet';
    stack.insertBefore(d, stack.firstChild);
  }
  var sheets = [].slice.call(document.querySelectorAll('.sheet'));
  var line = document.getElementById('line');
  var stamp = document.getElementById('stamp');

  window.__step = function (i) {
    // i: 0 ~ 23
    var 덜어낸수 = Math.min(i, 9);                 // 0~9 장이 사라진다
    sheets.forEach(function (s, k) {
      s.classList.toggle('gone', k < 덜어낸수);     // 위에서부터 사라짐
    });
    if (i < 3) line.innerHTML = '';
    else if (i < 10) line.innerHTML = '안 나오는 것부터 <b>덜어냅니다</b>';
    else if (i < 14) line.innerHTML = '3개년 기출에 <b>실제로 나온 개념만</b> 남깁니다';
    else line.innerHTML = '7일, <b>이것만 외우면 됩니다</b>';
    stamp.classList.toggle('on', i >= 13);
  };
  window.__step(0);
</script>
</body>
</html>
